<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fce4ec;
            margin: 0;
            padding: 40px;
        }

        .card {
            width: 450px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border: 1px solid #f48fb1;
            border-radius: 12px;
            box-shadow: 0 4px 10px #d7ccc8;
        }

        h1 {
            text-align: center;
            color: #880e4f;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e91e63;
        }

        #res {
            background-color: #fff0f5;
            color: #880e4f;
            font-weight: bold;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 16px;
            margin: 5px;
            background-color: #e91e63;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ad1457;
        }
    </style>

    <script>
        function addtwo() {
            var n1 = parseInt(document.getElementById("num1").value);
            var n2 = parseInt(document.getElementById("num2").value);

            var sum = n1 + n2;

            document.getElementById("res").value = sum;
        }

        function subtwo() {
            var n1 = parseInt(document.getElementById("num1").value);
            var n2 = parseInt(document.getElementById("num2").value);

            var sub = n1 - n2;

            document.getElementById("res").value = sub;
        }

        function multwo() {
            var n1 = parseInt(document.getElementById("num1").value);
            var n2 = parseInt(document.getElementById("num2").value);

            var mul = n1 * n2;

            document.getElementById("res").value = mul;
        }

        function divtwo() {
            var n1 = parseInt(document.getElementById("num1").value);
            var n2 = parseInt(document.getElementById("num2").value);

            var div = n1 / n2;

            document.getElementById("res").value = div;
        }
    </script>
</head>

<body>

    <div class="card">

        <h1>Basic Calculator</h1>

        <div class="input-group">
            <label>Enter Num1:</label>
            <input 
                type="number" 
                placeholder="Enter number" 
                id="num1"
            >
        </div>

        <div class="input-group">
            <label>Enter Num2:</label>
            <input 
                type="number" 
                placeholder="Enter number" 
                id="num2"
            >
        </div>

        <div class="input-group">
            <label>Result:</label>
            <input 
                type="text" 
                id="res" 
                readonly
            >
        </div>

        <div class="buttons">
            <button onclick="addtwo()">Add</button>

            <button onclick="subtwo()">Subtract</button>

            <button onclick="multwo()">Multiply</button>

            <button onclick="divtwo()">Division</button>
        </div>

    </div>

</body>
</html>
